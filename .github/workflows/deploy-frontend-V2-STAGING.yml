# Build and deploy Next.js app to Azure Web App (NO ARTIFACTS)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm install

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: 'https://app-serv-eventparcel-backend-v2-bndfhac5gzgne3dx.westeurope-01.azurewebsites.net'

      - name: Verify build output
        run: |
          echo "Checking .next folder..."
          ls -la .next/
          echo "Build successful!"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F73FC4D4FFED47C0A10F79D1579E03A3 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_29899A4C42244EB49F2FDA6691943D93 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_21401D13D843435CACE4E29957269148 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'app-serv-EventParcel-frontend-V2'
          slot-name: 'Production'
          package: .
          clean: false  # Keep existing files, including .next








