# Build and deploy Next.js app to Azure Web App (NO ARTIFACTS)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm install

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      - name: Verify build output
        run: |
          echo "Checking .next folder..."
          ls -la .next/
          echo "Build successful!"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_59CF3541AA1340EEA146E2CFB23053D8 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D0DF5D7F9FDA4245BA379BBD631B8295 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3C175E38E3A440D7888C36AD46FDADE5 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'app-serv-EventParcel-Client-V2'
          slot-name: 'Production'
          package: .
          clean: false  # Keep existing files, including .next
